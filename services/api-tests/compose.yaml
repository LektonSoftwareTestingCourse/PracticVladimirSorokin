name: sorokin-api

x-app: &app
  image: eclipse-temurin:21-jre-jammy
  command: [java, -jar, /app.jar]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"
  environment: &environment
    SERVER_PORT: 8080
    PORT: 8080
    JAVA_TOOL_OPTIONS: -Xmx192m -XX:ActiveProcessorCount=2
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: smp
    POSTGRES_USER: smp
    POSTGRES_PASSWORD: smp
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_USERNAME: smp
    SPRING_RABBITMQ_PASSWORD: smp
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

services:
  postgres: &database
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smp
      POSTGRES_USER: smp
      POSTGRES_PASSWORD: smp
    healthcheck:
      test: [CMD-SHELL, pg_isready -U smp -d smp]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]

  logger-postgres:
    <<: *database
    tmpfs: []
    volumes: [logger-data:/var/lib/postgresql/data]

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: smp
      RABBITMQ_DEFAULT_PASS: smp
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 30

  http-faults:
    image: python:3.13-alpine
    command: [python, /proxy.py]
    volumes: [./http_faults.py:/proxy.py:ro]
    ports: [127.0.0.1:18090:8089]

  card-management:
    <<: *app
    volumes: [../card-management/target/card-management-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18081:8080]

  authorization:
    <<: *app
    environment:
      <<: *environment
      CARD_MGMT_URL: http://http-faults:8081
      BIN_LOOKUP_URL: http://bin-lookup:8080
    volumes: [../authorization/target/authorization-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18083:8080]

  switch:
    <<: *app
    environment:
      <<: *environment
      AUTH_URL: http://http-faults:8083
      LOGGER_URL: http://transaction-logger:8080
      MERCHANT_URL: http://merchant-acquirer:8080
    volumes: [../switch/target/switch-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18082:8080]

  transaction-logger:
    <<: *app
    environment:
      <<: *environment
      POSTGRES_HOST: logger-postgres
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 2000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 1000
      SPRING_AMQP_DESERIALIZATION_TRUST_ALL: "true"
    depends_on:
      logger-postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    volumes: ["${LOGGER_JAR:-../transaction-logger/target/transaction-logger-1.0.0.jar}:/app.jar:ro"]
    ports: [127.0.0.1:18088:8080]

  bin-lookup:
    <<: *app
    volumes: [../bin-lookup/target/bin-lookup-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18096:8080]

  notification-service:
    <<: *app
    volumes: [../notification-service/target/notification-service-1.0.0.jar:/app.jar:ro]

  terminal-simulator:
    <<: *app
    environment:
      <<: *environment
      GATEWAY_URL: http://http-faults:8080
      CARD_MGMT_URL: http://http-faults:8081
    volumes: [../terminal-simulator/target/terminal-simulator-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18085:8080]

  merchant-acquirer:
    <<: *app
    environment:
      <<: *environment
      GATEWAY_URL: http://http-faults:8080
      CARD_MANAGEMENT_URL: http://http-faults:8081
    volumes: [../merchant-acquirer/target/merchant-acquirer-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18084:8080]

  gateway:
    <<: *app
    environment:
      <<: *environment
      SWITCH_URL: http://http-faults:8082
      TRANSACTIONS_RATE_LIMIT_CAPACITY: 2
      TRANSACTIONS_RATE_LIMIT_REFILL_PER_SECOND: 0
      AUTH_URL: http://authorization:8080
      CARD_MGMT_URL: http://card-management:8080
      LOGGER_URL: http://transaction-logger:8080
      TERMINAL_SIM_URL: http://terminal-simulator:8080
      MERCHANT_SIM_URL: http://merchant-acquirer:8080
    volumes: [../gateway/target/gateway-1.0.0.jar:/app.jar:ro]
    ports: [127.0.0.1:18080:8080]

volumes:
  logger-data:
